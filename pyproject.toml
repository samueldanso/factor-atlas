[project]
name = "factor-atlas"
version = "0.1.0"
description = "Agentic factor discovery for 24/7 tokenized stock markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factor_atlas"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
src = ["src", "tests"]
